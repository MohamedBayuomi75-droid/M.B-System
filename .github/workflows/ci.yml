# CI (خطة v1.4.5 — المرحلة 4، البند 4.1): كل اختبارات المشروع مع كل push وPR.
# مفيش أسرار ولا نشر هنا. القواعد المؤقتة بتتعمل جوه خدمة PostgreSQL بتاعة التشغيل وبتتمسح معاه.
# نفس منفذ وبيانات بيئة التطوير (docker/docker-compose.dev.yml) عشان الاختبارات تشتغل من غير أي إعداد.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PLAYWRIGHT_VERSION: '1.63.0'

jobs:
  # (1) فحوص سريعة: البنية، والأمان، والمستندات المولَّدة، والسيرفر unit، والواجهة الجديدة
  static:
    name: Static checks, server unit, frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix frontend ci
      - name: Project structure
        run: node tools/check-structure.js
      - name: Security and Excel tests
        run: node tools/test-security.js
      - name: Web build is up to date
        run: node tools/web/build-web.js --check
      - name: Generated discovery docs are up to date
        run: |
          for t in build-registry build-functional-inventory build-data-dictionary build-formula-catalogue build-electron-capabilities build-traceability build-parties-parity build-warehouses-parity build-supplier-invoices-parity build-supplier-payments-parity build-projects-parity build-workers-parity build-supervisors-drivers-parity build-employees-parity build-leaves-parity build-attendance-parity; do
            node tools/discovery/$t.js --check
          done
          node tools/ui/build-legacy-skin.js --check
      - name: Server lint
        run: npm --prefix server run lint
      - name: Server build
        run: npm --prefix server run build
      - name: Server unit tests
        run: npm --prefix server run test:unit
      - name: Frontend tests
        run: npm --prefix frontend test -- --watch=false
      - name: Frontend build
        run: npm --prefix frontend run build

  # (2) السيرفر e2e فوق PostgreSQL حقيقي
  server-e2e:
    name: Server e2e (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unified
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: unified
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U unified" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm --prefix server ci
      # بعض الاختبارات بتشغّل أدوات الـ CLI المبنية (dist/cli/tax-drafts.js وformula-drafts.js)
      - name: Server build
        run: npm --prefix server run build
      - name: Server e2e tests (incl. the OpenAPI contract)
        run: npm --prefix server run test:e2e

  # (3) المتصفح: الواجهة القديمة في أوضاعها التلاتة + اختبارات الويب والواجهة الجديدة والأمان والمعادلات
  browser:
    name: Browser (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        suite: [ui-file, ui-web, ui-cutover, web-app-security]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unified
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: unified
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U unified" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
      - run: npm --prefix server ci
      - run: npm --prefix server run build
      - name: Frontend build (for /app/)
        if: matrix.suite == 'web-app-security'
        run: npm --prefix frontend ci && npm --prefix frontend run build
      # الاختبارات بتعمل require('playwright') من أي مكان (زي بيئة التطوير): نسخة ثابتة متثبّتة global
      - name: Playwright ${{ env.PLAYWRIGHT_VERSION }} + Chromium
        run: |
          npm install -g playwright@${PLAYWRIGHT_VERSION}
          npx -y playwright@${PLAYWRIGHT_VERSION} install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Legacy UI — file mode
        if: matrix.suite == 'ui-file'
        run: node tests-merge/run-all.js
      - name: Legacy UI — web mode (records layer)
        if: matrix.suite == 'ui-web'
        run: node tests-merge/run-all.js
        env:
          WEB_MODE: '1'
      - name: Legacy UI — web mode over relational tables (parties, warehouses, supplier invoices and payments)
        if: matrix.suite == 'ui-cutover'
        run: node tests-merge/run-all.js
        env:
          WEB_MODE: '1'
          WEB_CUTOVER: parties,warehouses,supplier-invoices,supplier-payments,projects,workers,supervisors-drivers,employees,leaves,attendance
      - name: Web e2e (multi-browser session, 2FA, headers)
        if: matrix.suite == 'web-app-security'
        run: node tests-web/web-e2e.js
      - name: New UI e2e (/app/)
        if: matrix.suite == 'web-app-security'
        run: node tests-web/app-e2e.js
      - name: Workers table column layout = legacy (DEC-0122)
        if: matrix.suite == 'web-app-security'
        run: node tests-web/workers-layout-e2e.js
      - name: Workers form order = legacy (no saved layout)
        if: matrix.suite == 'web-app-security'
        run: node tests-web/workers-form-e2e.js
      - name: Supervisors and drivers tables and modals = legacy (DEC-0123)
        if: matrix.suite == 'web-app-security'
        run: node tests-web/people-layout-e2e.js
      - name: Employees cards, filters, tables (incl. the resigned section) and modal = legacy (DEC-0125)
        if: matrix.suite == 'web-app-security'
        run: node tests-web/employees-layout-e2e.js
      - name: Leaves page and modal = legacy, save/approve/reject/delete, status now (DEC-0127)
        if: matrix.suite == 'web-app-security'
        run: node tests-web/leaves-e2e.js
      - name: Dailies and employee attendance pages and modals = legacy, save/delete/review (DEC-0135)
        if: matrix.suite == 'web-app-security'
        run: node tests-web/dailies-e2e.js
      - name: XSS probe
        if: matrix.suite == 'web-app-security'
        run: node tools/security/xss-probe.js
      - name: Formulas — legacy vs independent reference
        if: matrix.suite == 'web-app-security'
        run: node tools/formulas/compare.js
      # المقارنة البصرية: إلزامية على خط أساس بيئة الـ CI (DEC-0089). اللقطات بتتأثر بخطوط الجهاز، فالـ CI ليه خط أساس خاص
      # (docs/discovery/visual-baseline-ci، بيتولّد بـ visual-baseline-ci.yml)، وبيئة التطوير ليها docs/discovery/visual-baseline.
      - name: Visual comparison with the CI baseline
        if: matrix.suite == 'web-app-security'
        run: node tools/discovery/visual-compare.js --baseline docs/discovery/visual-baseline-ci --out "$RUNNER_TEMP/visual"
      # الواجهة الجديدة /app/ (المرحلة 6، البند 6.4): الصفحات ونماذج الموردين والعملاء، على خط أساس بيئة الـ CI
      - name: Visual comparison of /app/ with the CI baseline
        if: matrix.suite == 'web-app-security'
        run: node tools/discovery/visual-compare.js --app --baseline docs/discovery/app-baseline-ci --out "$RUNNER_TEMP/visual/app"
      - name: Upload visual comparison report
        if: matrix.suite == 'web-app-security' && always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-comparison
          path: ${{ runner.temp }}/visual
          if-no-files-found: ignore
          retention-days: 14
