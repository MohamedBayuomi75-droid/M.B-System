# خط الأساس البصري الخاص ببيئة الـ CI (DEC-0089، خطة v1.4.5 المرحلة 4).
# اللقطات بتتأثر بخطوط الجهاز، فأجهزة GitHub محتاجة خط أساس خاص بيها.
# التشغيل: عدّل docs/discovery/visual-baseline-ci/REQUEST (أي سطر جديد بسبب التحديث) واعمل push.
# الـ workflow بيصوّر الواجهة القديمة (بيانات مُركّبة، تاريخ ثابت) والواجهة الجديدة /app/ (المرحلة 6، البند 6.4:
# سيرفر اختبار + قاعدة مؤقتة + بيانات مُركّبة) ويعمل commit للصور على نفس الفرع
# (docs/discovery/visual-baseline-ci و docs/discovery/app-baseline-ci).
# الـ commit ده بيتراجع قبل ما يتعتمد (اللقطات تتشاف في PR أو في الفرع).
name: Visual baseline (CI environment)

on:
  push:
    paths:
      - docs/discovery/visual-baseline-ci/REQUEST

permissions:
  contents: write

concurrency:
  group: visual-baseline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unified
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: unified
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U unified" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Playwright 1.63.0 + Chromium (same as CI)
        run: |
          npm install -g playwright@1.63.0
          npx -y playwright@1.63.0 install --with-deps chromium
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"
      - name: Capture the legacy UI
        run: node tools/discovery/discover-pages.js --out "$RUNNER_TEMP/capture"
      - name: Replace the CI baseline
        run: |
          rm -rf docs/discovery/visual-baseline-ci/desktop docs/discovery/visual-baseline-ci/mobile docs/discovery/visual-baseline-ci/dialogs
          cp -r "$RUNNER_TEMP/capture/visual-baseline/." docs/discovery/visual-baseline-ci/
      - name: Check stability (second capture must match)
        run: node tools/discovery/visual-compare.js --baseline docs/discovery/visual-baseline-ci --out "$RUNNER_TEMP/check"
      - name: Server + frontend build (for /app/)
        run: |
          npm --prefix server ci && npm --prefix server run build
          npm --prefix frontend ci && npm --prefix frontend run build
      - name: Capture the new UI (/app/)
        run: |
          rm -rf docs/discovery/app-baseline-ci/app
          node tools/discovery/capture-app.js --out docs/discovery/app-baseline-ci/app
      - name: Check stability of /app/ (second capture must match)
        run: node tools/discovery/visual-compare.js --app --baseline docs/discovery/app-baseline-ci --out "$RUNNER_TEMP/check-app"
      - name: Commit the CI baseline
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/discovery/visual-baseline-ci docs/discovery/app-baseline-ci
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -m "chore(visual): CI-environment visual baseline (DEC-0089, generated by visual-baseline-ci.yml)"
          git push origin "HEAD:${BRANCH}"
